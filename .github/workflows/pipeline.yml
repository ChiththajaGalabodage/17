name: LLM Continuous Testing Framework

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  verify-framework:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Run framework regression tests
        run: >-
          python -m pytest -q tests benchmarks/tests
          --ignore=tests/test_research_suite.py
          --ignore=tests/test_generated.py
          --ignore=tests/generated_tests.py
          --ignore=tests/experiments

      - name: Run clean benchmark pipeline
        run: >-
          python main.py
          --source benchmarks/calculator_subject.py
          --test-output reports/ci/benchmark_generated.py
          --report-output reports/ci/benchmark_pipeline.json
          --minimum-target-coverage 80
          --stability-runs 2
          --offline

      - name: Run mutation-ground-truth harness smoke test
        run: >-
          python scripts/run_research_experiment.py
          --offline
          --runs 1
          --stability-runs 2
          --mutation-limit 5
          --run-id ci-smoke

      - name: Run selection-metric harness smoke test
        run: >-
          python scripts/evaluate_test_selection.py
          --offline
          --runs 1
          --run-id ci-smoke

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuous-testing-evidence
          path: |
            reports/ci/
            reports/research_runs/ci-smoke/
            reports/selection_runs/ci-smoke/
